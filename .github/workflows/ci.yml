name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agenthub
          POSTGRES_PASSWORD: agenthub_test
          POSTGRES_DB: agenthub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenthub -d agenthub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://agenthub:agenthub_test@127.0.0.1:5432/agenthub_test
      TEST_DATABASE_URL: postgresql+asyncpg://agenthub:agenthub_test@127.0.0.1:5432/agenthub_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest -m "not postgres"
      - run: alembic upgrade head
      - run: pytest -m postgres
      - run: alembic downgrade 20260922_0003 && alembic upgrade head
