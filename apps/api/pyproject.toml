[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-hub-api"
version = "0.0.0"
description = "AgentHub FastAPI service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "email-validator==2.3.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "charset-normalizer==3.4.3",
    "nh3==0.3.2",
    "openai==3.20.0",
    "openpyxl==3.1.5",
    "pillow==11.3.0",
    "pypdf==6.19.0",
    "pwdlib[argon2]==0.3.0",
    "PyJWT==2.10.1",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.2.3",
    "qdrant-client==1.19.1",
    "sqlalchemy[asyncio]==2.0.54",
    "tzdata==2026.5",
    "uuid6==2025.0.1",
    "uvicorn[standard]==0.37.0",
    "xlrd==2.0.2",
]

[project.optional-dependencies]
dev = [
    "aiosqlite==0.22.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "postgres: opt-in tests that recreate agenthub_test in DATABASE_URL",
    "qdrant: opt-in tests that use an isolated non-production Qdrant collection",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
